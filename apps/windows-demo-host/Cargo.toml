[package]
name = "windows_demo_host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "windows_demo_host"

[[bin]]
name = "windows-demo-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1.10"
protobuf = "3.7"
remote_controller_core = { path = "../../libs/controller-core" }
serde_json = "1"
sha2 = "0.10"
sodiumoxide = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[workspace]
