[package]
name = "remote_controller_core"
version = "0.2.0"
edition = "2021"
build = "build.rs"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1.10"
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sodiumoxide = "0.2"
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["codec"] }
zeroize = "1"

[build-dependencies]
protobuf-codegen = "3.7"
sha2 = "0.10"

[workspace]
