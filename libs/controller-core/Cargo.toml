[package]
name = "remote_controller_core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
bytes = "1.10"
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }

[build-dependencies]
protobuf-codegen = "3.7"

[workspace]
